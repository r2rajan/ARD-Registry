[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "travel_orchestrator"
version = "0.1.0"
description = "Travel Orchestrator - coordinates specialist agents via A2A"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[all] >= 0.2.0, < 1.0.0",
    "aws-opentelemetry-distro",
    "bedrock-agentcore[a2a] >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "httpx >= 0.27.0",
    "strands-agents >= 1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
